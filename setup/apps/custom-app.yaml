---
apiVersion: v1
kind: Namespace
metadata:
  name: custom-app
  labels:
    kubernetes.io/metadata.name: custom-app
    istio-injection: enabled
---
# ServiceMeshMember — the OSSM 2.x way to opt a namespace into the mesh
apiVersion: maistra.io/v1
kind: ServiceMeshMember
metadata:
  name: default
  namespace: custom-app
spec:
  controlPlaneRef:
    name: basic
    namespace: istio-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: custom-app
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: custom-app
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: custom-app
  labels:
    app: httpbin
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: docker.io/kennethreitz/httpbin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          command: ["gunicorn", "--bind=0.0.0.0:8080", "httpbin:app", "-k", "gevent"]
          env:
            - name: GUNICORN_CMD_ARGS
              value: "--capture-output --error-logfile - --access-logfile - --access-logformat '%(h)s %(t)s %(r)s %(s)s Host: %({Host}i)s'"
---
# Strict mTLS in this namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: custom-app
spec:
  mtls:
    mode: STRICT
---
# AuthorizationPolicy — only allow traffic from bookinfo productpage
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: httpbin-allow-bookinfo
  namespace: custom-app
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/bookinfo/sa/bookinfo-productpage"
    - from:
        - source:
            namespaces:
              - "istio-system"
---
# VirtualService for httpbin
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: httpbin
  namespace: custom-app
spec:
  hosts:
    - httpbin
  http:
    - route:
        - destination:
            host: httpbin
            port:
              number: 8000
      timeout: 5s
---
# DestinationRule for httpbin
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: httpbin
  namespace: custom-app
spec:
  host: httpbin
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: v1
      labels:
        version: v1
